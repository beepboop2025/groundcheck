name: publish-mcp

# Publish the MCP registry listing (io.github.beepboop2025/groundcheck).
# Authenticates with the workflow's own OIDC token — no secrets needed.
# Run manually (workflow_dispatch) after bumping server.json, or cut a release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write            # lets mcp-publisher prove the namespace via OIDC

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          curl --fail --silent --show-error --location \
            --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file mcp-publisher.tar.gz mcp-publisher
          chmod 0755 mcp-publisher
      - name: Validate and publish server.json
        run: |
          ./mcp-publisher login github-oidc
          # NOTE: current mcp-publisher treats --dry-run as a real publish;
          # a single publish is the whole job.
          ./mcp-publisher publish

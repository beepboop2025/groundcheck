name: publish-mcp

# Publish the MCP registry listing (io.github.beepboop2025/groundcheck).
# Authenticates with the workflow's own OIDC token — no secrets needed.
# Run manually (workflow_dispatch) after bumping server.json, or cut a release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write            # lets mcp-publisher prove the namespace via OIDC

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz"
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher && sudo mv mcp-publisher /usr/local/bin/
      - name: Validate and publish server.json
        run: |
          mcp-publisher login github-oidc
          # NOTE: current mcp-publisher treats --dry-run as a real publish;
          # a single publish is the whole job.
          mcp-publisher publish

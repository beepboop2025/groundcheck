[project]
name = "groundcheck-engine"
license = { text = "MIT" }
version = "0.3.0"
description = "Evidence + verdict engine for Groundcheck (retrieval, stance classification, verdict)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    # Ed25519 response attestation (groundcheck_engine/attest.py)
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# CDP mainnet facilitator auth (per-request JWT). Only needed when
# GROUNDCHECK_X402_CDP_KEY_ID/SECRET are set; imported lazily otherwise.
cdp = ["cdp-sdk>=1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
# Match ../security-constraints.txt without adding optional CDP packages to the
# base engine installation.
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "anyio>=4.14.2",
    "cryptography>=50.0.0",
    "h2>=4.4.1",
    "httpcore2>=2.10.0",
    "httpx2>=2.12.0",
    "PyJWT>=2.14.0",
]
